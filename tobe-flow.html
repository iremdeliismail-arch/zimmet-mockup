<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zimmet TO-BE Business Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5c6570;
      --line: #d8dee6;
      --accent: #0f5f73;
      --accent-text: #ffffff;
      --process: #eef1f5;
      --decision: #fbf3dc;
      --system: #e6f3f6;
      --start: #0f5f73;
      --exception: #fdecec;
      --yes: #1f7a4d;
      --no: #b42318;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.45; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 20px 24px 12px;
      position: sticky; top: 0; z-index: 10;
    }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    main { max-width: 980px; margin: 0 auto; padding: 20px 24px 48px; }
    .note {
      background: #e6f3f6;
      border: 1px solid #b7d4dc;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 16px; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #9aa3ad; display: inline-block; }
    .swatch.diamond { width: 10px; height: 10px; transform: rotate(45deg); border-radius: 1px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
    .panel p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .flow-wrap { overflow: auto; display: flex; justify-content: center; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 140px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    footer { color: var(--muted); font-size: 12px; padding-top: 8px; }
    svg text { font-family: var(--font); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>IT Asset / Zimmet — TO-BE Business Flow</h1>
    <div class="sub">V2 doküman · kutular yukarıdan aşağı okunur</div>
    <nav id="tabs"></nav>
  </header>
  <main id="app"></main>
  <script>
    const TABS = [
      { id: "ozet", label: "Özet" },

    const FLOWS = {
      onb: {

          { id: "n2", label: "LDAP personel bilgisi", sub: "Sicil · ünvan · lokasyon", kind: "system" },
          { id: "n3", label: "Personel ve tarih seçilir", sub: "İnsan Kaynakları", kind: "process" },

          { id: "n5", label: "Paket ve stok kontrolü", sub: "Sistem Destek Uzmanı", kind: "process" },
          { id: "n6", label: "Logo ERP stok sorgusu", sub: "Depo · ürün · miktar", kind: "system" },
          { id: "n7", label: "Stokta mı?", kind: "decision" },
          { id: "n7n", label: "Alternatif ürün seç", sub: "Sistem Destek", kind: "process" },
          { id: "n8", label: "Paket dahilinde mi?", kind: "decision" },
          { id: "n9", label: "CO / CEO onayı", sub: "Onay Bekliyor", kind: "process" },
          { id: "n10", label: "Onaylandı mı?", kind: "decision" },
          { id: "n10n", label: "Destek'e geri dön", sub: "Reddedildi · güncelle / iptal", kind: "exception" },
          { id: "n11", label: "Seri numarası seç", sub: "Depo Sorumlusu · Logo", kind: "process" },
          { id: "n12", label: "Sevk irsaliyesi oluştur", sub: "Logo ERP", kind: "system" },
          { id: "n13", label: "Teslim al ve teknik kontrol", sub: "Sistem Destek", kind: "process" },
          { id: "n14", label: "Uygun mu?", kind: "decision" },
          { id: "n14n", label: "Hasar raporu · depo yeniden", sub: "Hasarlı", kind: "exception" },
          { id: "n15", label: "Zimmet formu oluştur", sub: "Sistem Destek", kind: "process" },
          { id: "n16", label: "Dijital imza / e-onay", sub: "Çalışan · teslim alan", kind: "process" },
          { id: "n17", label: "Zimmet tamamlandı", sub: "Tamamlandı", kind: "end" },
        ],
        edges: [
          ["n1", "n2"], ["n2", "n3"], ["n3", "n4"], ["n4", "n5"], ["n5", "n6"], ["n6", "n7"],
          ["n7", "n7n", "Hayır"], ["n7", "n8", "Evet"], ["n7n", "n8"],
          ["n8", "n11", "Evet"], ["n8", "n9", "Hayır"],
          ["n9", "n10"], ["n10", "n11", "Evet"], ["n10", "n10n", "Hayır"],
          ["n11", "n12"], ["n12", "n13"], ["n13", "n14"],
          ["n14", "n15", "Uygun"], ["n14", "n14n", "Hasarlı"],
          ["n15", "n16"], ["n16", "n17"],
        ],
      },
      ayrilis: {
        nodes: [
          { id: "c0", label: "İK işten ayrılış kaydı", sub: "İade Bekliyor", kind: "start" },
          { id: "c1", label: "Aktif zimmetleri getir", sub: "Sistem", kind: "system" },
          { id: "c2", label: "Destek'e bildir", sub: "Uygulama bildirimi", kind: "system" },
          { id: "c3", label: "Ürünleri teslim al", sub: "Sistem Destek", kind: "process" },
          { id: "c4", label: "Kontrol formu", sub: "Model · seri · aksesuar · hasar", kind: "process" },
          { id: "c5", label: "Cihaz durumu seç", sub: "Yeniden / bakım / hurda", kind: "process" },
          { id: "c6", label: "İade Tamamla", sub: "Sistem Destek", kind: "process" },
          { id: "c7", label: "Merkez depoya sevk", sub: "Logo ERP irsaliye", kind: "system" },
          { id: "c8", label: "Asset durumunu güncelle", sub: "Sistem", kind: "system" },
          { id: "c9", label: "Süreç kapatıldı", sub: "Tamamlandı", kind: "end" },
        ],
        edges: [
          ["c0", "c1"], ["c1", "c2"], ["c2", "c3"], ["c3", "c4"], ["c4", "c5"],
          ["c5", "c6"], ["c6", "c7"], ["c7", "c8"], ["c8", "c9"],
        ],
      },
      devir: {
        nodes: [
          { id: "d0", label: "Zimmet kaydını seç", sub: "Cihaz Zimmetleri", kind: "start" },
          { id: "d1", label: "Yeni kullanıcı seç", sub: "Sistem Destek · LDAP", kind: "process" },
          { id: "d2", label: "Aynı lokasyon mu?", kind: "decision" },
          { id: "d2n", label: "Devir durur", sub: "Lokasyon uyuşmazlığı", kind: "exception" },
          { id: "d3", label: "Formu personele gönder", sub: "Sistem Destek", kind: "process" },
          { id: "d4", label: "Eski zimmeti kapat", sub: "Sistem", kind: "system" },
          { id: "d5", label: "Yeni zimmet oluştur", sub: "Sistem · geçmiş korunur", kind: "system" },
          { id: "d6", label: "İmza veya e-onay", sub: "Yeni kullanıcı", kind: "process" },
          { id: "d7", label: "Devir tamamlandı", sub: "Fiziksel sevk yok", kind: "end" },
        ],
        edges: [
          ["d0", "d1"], ["d1", "d2"],
          ["d2", "d3", "Evet"], ["d2", "d2n", "Hayır"],
          ["d3", "d4"], ["d4", "d5"], ["d5", "d6"], ["d6", "d7"],
        ],
      },
      degisim: {
        nodes: [
          { id: "e0", label: "Çalışan seç", sub: "Sistem Destek", kind: "start" },
          { id: "e1", label: "Mevcut cihaz ve paket", sub: "Sistem", kind: "system" },
          { id: "e2", label: "Yeni cihaz seç", sub: "Talep Oluşturuldu", kind: "process" },
          { id: "e3", label: "Paket dahilinde mi?", kind: "decision" },
          { id: "e4", label: "CO / CEO onayı", sub: "Onay Bekliyor", kind: "process" },
          { id: "e5", label: "Onaylandı mı?", kind: "decision" },
          { id: "e5n", label: "Destek'e geri dön", sub: "Reddedildi", kind: "exception" },
          { id: "e6", label: "Depo · sevk · teknik", sub: "İşe başlangıç ile aynı hat", kind: "process" },
          { id: "e7", label: "Eski cihazı teslim al", sub: "Sistem Destek", kind: "process" },
          { id: "e8", label: "Eski cihaz durumu", sub: "Yeniden / bakım / hurda", kind: "process" },
          { id: "e9", label: "Teslim ve durum OK?", kind: "decision" },
          { id: "e9n", label: "Süreç kapanmaz", sub: "Eksik teslim veya durum", kind: "exception" },
          { id: "e10", label: "Yeni zimmet formu", sub: "Sistem Destek", kind: "process" },
          { id: "e11", label: "İmza veya e-onay", sub: "Çalışan", kind: "process" },
          { id: "e12", label: "Değişim tamamlandı", sub: "Eski kapanır · yeni açılır", kind: "end" },
        ],
        edges: [
          ["e0", "e1"], ["e1", "e2"], ["e2", "e3"],
          ["e3", "e6", "Evet"], ["e3", "e4", "Hayır"],
          ["e4", "e5"], ["e5", "e6", "Evet"], ["e5", "e5n", "Hayır"],
          ["e6", "e7"], ["e7", "e8"], ["e8", "e9"],
          ["e9", "e10", "Evet"], ["e9", "e9n", "Hayır"],
          ["e10", "e11"], ["e11", "e12"],
        ],
      },
    };

    function layout(flow) {
      const nodeWidth = 260;
      const nodeHeight = 78;
      const rankGap = 48;
      const nodeGap = 28;
      const padding = 28;
      const ids = flow.nodes.map((n) => n.id);
      const incoming = Object.fromEntries(ids.map((id) => [id, []]));
      flow.edges.forEach(([from, to]) => incoming[to].push(from));
      const rank = {};
      const visit = new Set();
      function getRank(id) {
        if (rank[id] != null) return rank[id];
        if (visit.has(id)) return 0;
        visit.add(id);
        const preds = incoming[id] || [];
        rank[id] = preds.length ? Math.max(...preds.map(getRank)) + 1 : 0;
        return rank[id];
      }
      ids.forEach(getRank);
      const byRank = {};
      ids.forEach((id) => { (byRank[rank[id]] ||= []).push(id); });
      const maxRank = Math.max(0, ...Object.keys(byRank).map(Number));
      let maxWidth = nodeWidth;
      for (let r = 0; r <= maxRank; r++) {
        const row = byRank[r] || [];
        maxWidth = Math.max(maxWidth, row.length * nodeWidth + Math.max(0, row.length - 1) * nodeGap);
      }
      const positions = {};
      for (let r = 0; r <= maxRank; r++) {
        const row = byRank[r] || [];
        const rowW = row.length * nodeWidth + Math.max(0, row.length - 1) * nodeGap;
        let x = padding + (maxWidth - rowW) / 2;
        const y = padding + r * (nodeHeight + rankGap);
        row.forEach((id) => {
          positions[id] = { x, y };
          x += nodeWidth + nodeGap;
        });
      }
      return {
        positions, nodeWidth, nodeHeight,
        width: maxWidth + padding * 2,
        height: padding * 2 + (maxRank + 1) * nodeHeight + maxRank * rankGap,
      };
    }

    function fill(kind) {
      if (kind === "decision") return "var(--decision)";
      if (kind === "system") return "var(--system)";
      if (kind === "exception") return "var(--exception)";
      if (kind === "start" || kind === "end") return "var(--start)";
      return "var(--process)";
    }
    function textFill(kind) {
      return kind === "start" || kind === "end" ? "var(--accent-text)" : "var(--text)";
    }
    function wrapLabel(label, max) {
      if (label.length <= max) return [label];
      const words = label.split(" ");
      const lines = [];
      let cur = "";
      words.forEach((w) => {
        const next = cur ? cur + " " + w : w;
        if (next.length > max && cur) { lines.push(cur); cur = w; }
        else cur = next;
      });
      if (cur) lines.push(cur);
      return lines.slice(0, 3);
    }
    function branchSide(label, index, count) {
      const s = (label || "").toLowerCase();
      if (s.includes("hayır") || s.includes("hasar") || s.includes("ret")) return "left";
      if (s.includes("evet") || s.includes("uygun") || s.includes("onay")) return "right";
      if (count === 2) return index === 0 ? "left" : "right";
      return "bottom";
    }
    function anchor(pos, kind, side, W, H) {
      const cx = pos.x + W / 2;
      const cy = pos.y + H / 2;
      if (side === "left") return { x: pos.x, y: cy };
      if (side === "right") return { x: pos.x + W, y: cy };
      if (side === "top") return { x: cx, y: pos.y };
      return { x: cx, y: pos.y + H };
    }

    function renderFlow(flow, title) {
      const L = layout(flow);
      const nodeMap = Object.fromEntries(flow.nodes.map((n) => [n.id, n]));
      const markerId = "m-" + title;
      const outgoing = {};
      flow.edges.forEach((e) => { (outgoing[e[0]] ||= []).push(e); });
      const sideOf = {};
      Object.keys(outgoing).forEach((from) => {
        const list = outgoing[from];
        list.forEach((e, i) => {
          sideOf[e[0] + "->" + e[1]] = list.length === 1 ? "bottom" : branchSide(e[2], i, list.length);
        });
        if (list.length === 2) {
          const a = sideOf[list[0][0] + "->" + list[0][1]];
          const b = sideOf[list[1][0] + "->" + list[1][1]];
          if (a === b) {
            sideOf[list[0][0] + "->" + list[0][1]] = "left";
            sideOf[list[1][0] + "->" + list[1][1]] = "right";
          }
        }
      });
      const lines = flow.edges.map(([from, to, label]) => {
        const a = L.positions[from], b = L.positions[to];
        const side = sideOf[from + "->" + to] || "bottom";
        const p1 = anchor(a, nodeMap[from].kind, side, L.nodeWidth, L.nodeHeight);
        const p2 = anchor(b, nodeMap[to].kind, "top", L.nodeWidth, L.nodeHeight);
        let d;
        if (side === "left" || side === "right") {
          const elbow = side === "left" ? p1.x - 18 : p1.x + 18;
          const midY = (p1.y + p2.y) / 2;
          d = `M ${p1.x} ${p1.y} L ${elbow} ${p1.y} L ${elbow} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
        } else {
          d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
        }
        const color = (label || "").toLowerCase().includes("hayır") || (label || "").toLowerCase().includes("hasar")
          ? "var(--no)" : (label || "").toLowerCase().includes("evet") || (label || "").toLowerCase().includes("uygun")
            ? "var(--yes)" : "#9aa3ad";
        const lx = side === "left" ? p1.x - 22 : side === "right" ? p1.x + 22 : (p1.x + p2.x) / 2;
        const ly = side === "bottom" ? (p1.y + p2.y) / 2 - 4 : p1.y - 8;
        return `<g>
          <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" marker-end="url(#${markerId})" />
          ${label ? `<text x="${lx}" y="${ly}" text-anchor="middle" fill="${color}" font-size="11" font-weight="600">${label}</text>` : ""}
        </g>`;
      }).join("");
      const boxes = flow.nodes.map((n) => {
        const p = L.positions[n.id];
        const cx = p.x + L.nodeWidth / 2;
        const cy = p.y + L.nodeHeight / 2;
        const linesOf = wrapLabel(n.label, n.kind === "decision" ? 14 : 28);
        const shape = n.kind === "decision"
          ? `<polygon points="${cx},${p.y} ${p.x + L.nodeWidth},${cy} ${cx},${p.y + L.nodeHeight} ${p.x},${cy}" fill="${fill(n.kind)}" stroke="#9aa3ad" stroke-width="1.5" />`
          : `<rect x="${p.x}" y="${p.y}" width="${L.nodeWidth}" height="${L.nodeHeight}" rx="8" fill="${fill(n.kind)}" stroke="${n.kind === "start" || n.kind === "end" ? "var(--accent)" : "#9aa3ad"}" />`;
        const startY = n.sub && n.kind !== "decision" ? cy - 6 - (linesOf.length - 1) * 6 : cy + 4 - linesOf.length * 7;
        const text = linesOf.map((line, i) =>
          `<text x="${cx}" y="${startY + i * 14}" text-anchor="middle" fill="${textFill(n.kind)}" font-size="${n.kind === "decision" ? 11 : 13}" font-weight="600">${line}</text>`
        ).join("");
        const sub = n.sub && n.kind !== "decision"
          ? `<text x="${cx}" y="${cy + 18}" text-anchor="middle" fill="${n.kind === "start" || n.kind === "end" ? "#d5e8ed" : "var(--muted)"}" font-size="11">${n.sub.length > 36 ? n.sub.slice(0, 34) + "…" : n.sub}</text>`
          : "";
        return `<g>${shape}${text}${sub}</g>`;
      }).join("");
      return `<div class="flow-wrap"><svg width="${L.width}" height="${L.height}">
        <defs><marker id="${markerId}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#9aa3ad" />
        </marker></defs>
        ${lines}${boxes}
      </svg></div>`;
    }

    function legend() {
      return `<div class="legend">
        <span><i class="swatch" style="background:var(--start);border-color:var(--start)"></i> Başlangıç / bitiş</span>
        <span><i class="swatch" style="background:var(--process)"></i> Manuel işlem</span>
        <span><i class="swatch" style="background:var(--system)"></i> Sistem / entegrasyon</span>
        <span><i class="swatch diamond" style="background:var(--decision)"></i> Karar</span>
        <span><i class="swatch" style="background:var(--exception);border-color:var(--no)"></i> Red / istisna</span>
      </div>`;
    }
    function table(headers, rows) {
      return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }

    const pages = {
      ozet() {
        return `
          <div class="note"><b>TO-BE.</b> Akış yukarıdan aşağı okunur. Ret sonrası süreç kapanmaz; talep Sistem Destek’e döner.</div>
          <div class="stats">
            <div class="stat"><b>4</b><span>Operasyonel süreç</span></div>
            <div class="stat"><b>5</b><span>Rol</span></div>
            <div class="stat"><b>2</b><span>LDAP + Logo ERP</span></div>
          </div>
          ${legend()}
          <div class="panel">
            <h2>Süreçler</h2>
            ${table(["Süreç", "Başlangıç", "Bitiş"], [
              ["İşe Başlangıç", "İK talep", "Zimmet + imza · Tamamlandı"],
              ["İşten Ayrılış", "İK iade kaydı", "Logo merkez sevk"],
              ["Zimmet Devri", "Destek kayıt seçer", "Yeni zimmet · sevk yok"],
              ["Cihaz Değişimi", "Destek talep", "Eski kapanır · yeni açılır"],
            ])}
          </div>`;
      },
      onb() {
        return `${legend()}
          <div class="note"><b>Ret kuralı.</b> CO / CEO reddederse işlem sonlanmaz. Kayıt Destek kuyruğuna döner.</div>
          <div class="panel">
            <h2>İşe başlangıç — uçtan uca</h2>
            <p>İK talep → Destek stok/paket → gerekirse CO/CEO → depo seri ve irsaliye → teknik kontrol → form → çalışan imzası.</p>
            ${renderFlow(FLOWS.onb, "onb")}
          </div>`;
      },
      ayrilis() {
        return `${legend()}
          <div class="panel">
            <h2>İşten ayrılış / zimmet iadesi</h2>
            ${renderFlow(FLOWS.ayrilis, "off")}
          </div>`;
      },
      devir() {
        return `${legend()}
          <div class="panel">
            <h2>Zimmet devri</h2>
            <p>Aynı lokasyon zorunlu. Fiziksel depo transferi yok.</p>
            ${renderFlow(FLOWS.devir, "dev")}
          </div>`;
      },
      degisim() {
        return `${legend()}
          <div class="panel">
            <h2>Cihaz değişimi</h2>
            <p>Paket dışı onay reddedilirse Destek’e döner. Yeni teslim ve eski cihaz durumu olmadan kapanmaz.</p>
            ${renderFlow(FLOWS.degisim, "chg")}
          </div>`;
      },
      eslesme() {
        return `<div class="panel">
          <h2>Doküman adımı → mockup ekranı</h2>
          ${table(["Doküman adımı", "Mockup", "Sonraki"], [
            ["İK personel seçer", "Yeni işe başlangıç", "Destek kontrolü"],
            ["Paket + Logo stok", "İşe başlangıç detay", "Depo veya onay"],
            ["CO / CEO", "Onaylarım", "Depo veya Destek’e dönüş"],
            ["Seri + irsaliye", "Depo hazırlık", "Teknik kontrol"],
            ["Form + imza", "Zimmet formu / Onaylarım", "Tamamlandı"],
            ["İade", "İşten ayrılış detay", "Logo sevk"],
            ["Devir", "Cihaz Zimmetleri → Devir", "Çalışan onay"],
            ["Cihaz değişimi", "Değişim talebi / detay", "Yeni zimmet formu"],
          ])}
        </div>`;
      },
    };

    let current = new URLSearchParams(location.search).get("tab") || "onb";
    if (!pages[current]) current = "onb";
    function render() {
      document.getElementById("tabs").innerHTML = TABS.map((t) =>
        `<button class="${t.id === current ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`
      ).join("");
      document.querySelectorAll("#tabs button").forEach((btn) => {
        btn.onclick = () => {
          current = btn.dataset.tab;
          history.replaceState(null, "", "?tab=" + current);
          render();
        };
      });
      document.getElementById("app").innerHTML = pages[current]() +
        `<footer>Kaynak: Zimmet Gereksinim Dokümanı V2</footer>`;
    }
    render();
  </script>
</body>
</html>

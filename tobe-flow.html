<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zimmet TO-BE Business Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5c6570;
      --line: #d8dee6;
      --accent: #0f5f73;
      --process: #eef1f5;
      --decision: #fbf3dc;
      --system: #e6f3f6;
      --exception: #fdecec;
      --yes: #1f7a4d;
      --no: #b42318;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 20px 24px 12px;
      position: sticky; top: 0; z-index: 10;
    }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav button {
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      border-radius: 6px; padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
    }
    nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    main { max-width: 920px; margin: 0 auto; padding: 20px 24px 48px; }
    .note {
      background: #e6f3f6; border: 1px solid #b7d4dc; border-radius: 8px;
      padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 16px; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #9aa3ad; display: inline-block; }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 20px 16px 28px; margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
    .panel p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    footer { color: var(--muted); font-size: 12px; padding-top: 8px; }
    .chart { width: 100%; overflow-x: auto; }
    .chart svg { display: block; width: 100%; max-width: 800px; height: auto; margin: 0 auto; }
  </style>
</head>
<body>
  <header>
    <h1>IT Asset / Zimmet — TO-BE Business Flow</h1>
    <div class="sub">V1.1 · 31.08.2026 · ana hat yukarıdan aşağı, Hayır dalları solda</div>
    <nav id="tabs"></nav>
  </header>
  <main id="app"></main>
  <script>
    const TABS = [
      { id: "ozet", label: "Özet" },
      { id: "onb", label: "İşe Başlangıç" },
      { id: "ayrilis", label: "İşten Ayrılış" },
      { id: "devir", label: "Zimmet Devri" },
      { id: "degisim", label: "Cihaz Değişimi" },
      { id: "eslesme", label: "Ekran eşleşmesi" },
    ];

    const INK = "#1b1f24";
    const MUTED = "#5c6570";
    const LINE = "#334155";
    const YES = "#1f7a4d";
    const NO = "#b42318";

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function chart(w, h, inner) {
      return `<div class="chart"><svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="IBM Plex Sans, Segoe UI, sans-serif">${inner}</svg></div>`;
    }
    function box(x, y, w, h, title, sub, kind) {
      const fill = kind === "start" || kind === "end" ? "#0f5f73"
        : kind === "system" ? "#e6f3f6"
        : kind === "exception" ? "#fdecec" : "#eef1f5";
      const stroke = kind === "start" || kind === "end" ? "#0f5f73"
        : kind === "exception" ? NO : "#8b95a1";
      const tc = kind === "start" || kind === "end" ? "#ffffff" : INK;
      const sc = kind === "start" || kind === "end" ? "#d5e8ed" : MUTED;
      const ty = sub ? y + h / 2 - 5 : y + h / 2 + 4;
      let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
      out += `<text x="${x + w / 2}" y="${ty}" text-anchor="middle" font-size="13" font-weight="600" fill="${tc}">${esc(title)}</text>`;
      if (sub) out += `<text x="${x + w / 2}" y="${ty + 16}" text-anchor="middle" font-size="11" fill="${sc}">${esc(sub)}</text>`;
      return out;
    }
    function dia(cx, cy, r, label) {
      return `<polygon points="${cx},${cy - r} ${cx + r},${cy} ${cx},${cy + r} ${cx - r},${cy}" fill="#fbf3dc" stroke="#5c6570" stroke-width="2"/>` +
        `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="13" font-weight="600" fill="${INK}">${esc(label)}</text>`;
    }
    function head(x, y, dir, color) {
      const a = 7, b = 13;
      if (dir === "d") return `<polygon points="${x},${y} ${x - a},${y - b} ${x + a},${y - b}" fill="${color}"/>`;
      if (dir === "u") return `<polygon points="${x},${y} ${x - a},${y + b} ${x + a},${y + b}" fill="${color}"/>`;
      if (dir === "r") return `<polygon points="${x},${y} ${x - b},${y - a} ${x - b},${y + a}" fill="${color}"/>`;
      return `<polygon points="${x},${y} ${x + b},${y - a} ${x + b},${y + a}" fill="${color}"/>`;
    }
    function seg(x1, y1, x2, y2, color) {
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" stroke-linecap="square"/>`;
    }
    function vArr(x, y1, y2, color) {
      color = color || LINE;
      return seg(x, y1, x, y2 - 1, color) + head(x, y2, "d", color);
    }
    function pathArr(pts, dir, color) {
      color = color || LINE;
      const pairs = [];
      for (let i = 0; i < pts.length; i += 2) pairs.push(pts[i] + "," + pts[i + 1]);
      return `<polyline points="${pairs.join(" ")}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square"/>` +
        head(pts[pts.length - 2], pts[pts.length - 1], dir, color);
    }
    function label(x, y, text, color) {
      return `<text x="${x}" y="${y}" font-size="12" font-weight="700" fill="${color}">${esc(text)}</text>`;
    }
    function note(x, y, text) {
      return `<text x="${x}" y="${y}" font-size="11" fill="${MUTED}">${esc(text)}</text>`;
    }

    function stackFlow(steps) {
      const CX = 400, BX = 270, BW = 260, BH = 68, GAP = 34;
      let y = 16, out = "";
      steps.forEach((s, i) => {
        if (i) out += vArr(CX, y - GAP, y);
        out += box(BX, y, BW, BH, s[0], s[1], s[2]);
        y += BH + GAP;
      });
      return chart(800, y + 8, out);
    }

    function onbFlow() {
      const CX = 400, BX = 270, BW = 260, BH = 68, R = 70, L = 130;
      let o = "";

      const yIk = 16, yLdap = 118, yPer = 220, yLoc = 322, yPak = 424, yStok = 526, yLogo = 628;
      o += box(BX, yIk, BW, BH, "İK talebi başlatır", "İşe başlangıç", "start");
      o += vArr(CX, yIk + BH, yLdap);
      o += box(BX, yLdap, BW, BH, "LDAP personel bilgisi", "Sicil · ünvan · lokasyon", "system");
      o += vArr(CX, yLdap + BH, yPer);
      o += box(BX, yPer, BW, BH, "Personel ve tarih seçilir", "İnsan Kaynakları");
      o += vArr(CX, yPer + BH, yLoc);
      o += box(BX, yLoc, BW, BH, "Çalışma / teslim lokasyonu", "LDAP varsayılan · teslim değiştirilebilir");
      o += vArr(CX, yLoc + BH, yPak);
      o += box(BX, yPak, BW, BH, "Ünvan paketi önerilir", "Sistem otomasyonu", "system");
      o += vArr(CX, yPak + BH, yStok);
      o += box(BX, yStok, BW, BH, "Paket ve stok kontrolü", "Sistem Destek Uzmanı");
      o += vArr(CX, yStok + BH, yLogo);
      o += box(BX, yLogo, BW, BH, "Logo ERP stok sorgusu", "Depo · ürün · miktar", "system");

      const d1 = 770;
      o += vArr(CX, yLogo + BH, d1 - R);
      o += dia(CX, d1, R, "Stokta mı?");

      const altY = 880;
      o += pathArr([CX, d1 + R, CX, d1 + R + 18, L, d1 + R + 18, L, altY], "d", NO);
      o += label(148, d1 + R + 14, "Hayır", NO);
      o += box(20, altY, 220, BH, "Alternatif ürün seç", "Sistem Destek");
      o += note(20, altY + BH + 16, "Sonra paket kontrolüne döner");

      const d2 = 1090;
      o += pathArr([L, altY + BH, L, d2 - R - 24, CX, d2 - R - 24, CX, d2 - R], "d", NO);
      o += vArr(CX, d1 + R, d2 - R, YES);
      o += label(412, d1 + R + 24, "Evet", YES);
      o += dia(CX, d2, R, "Paket dahilinde mi?");

      const ceoY = 1200;
      o += pathArr([CX, d2 + R, CX, d2 + R + 18, L, d2 + R + 18, L, ceoY], "d", NO);
      o += label(148, d2 + R + 14, "Hayır", NO);
      o += box(20, ceoY, 220, BH, "CO / CEO onayı", "Onay Bekliyor");

      const d3x = L, d3y = 1368, d3r = 62;
      o += vArr(L, ceoY + BH, d3y - d3r);
      o += dia(d3x, d3y, d3r, "Onaylandı mı?");

      const retY = 1480;
      o += pathArr([d3x - d3r, d3y, 48, d3y, 48, retY], "d", NO);
      o += label(8, d3y - 8, "Hayır", NO);
      o += box(8, retY, 200, BH, "Destek'e geri dön", "Güncelle veya iptal", "exception");

      const seriY = 1640;
      o += pathArr([d3x + d3r, d3y, 250, d3y, 250, seriY - 28, CX, seriY - 28, CX, seriY], "d", YES);
      o += label(256, d3y - 8, "Evet · depo", YES);
      o += vArr(CX, d2 + R, seriY, YES);
      o += label(412, d2 + R + 28, "Evet · onay gerekmez", YES);

      o += box(BX, seriY, BW, BH, "Seri numarası seç", "Depo Sorumlusu · Logo");
      const yIrs = 1742;
      const yTek = 1844;
      o += vArr(CX, seriY + BH, yIrs);
      o += box(BX, yIrs, BW, BH, "İrsaliye 1: Depo → GM", "Logo ERP · tek sevk merkeze", "system");
      o += vArr(CX, yIrs + BH, yTek);
      o += box(BX, yTek, BW, BH, "Teslim al ve teknik kontrol", "Sistem Destek · Genel Merkez");

      const d4 = 1980;
      o += vArr(CX, yTek + BH, d4 - R);
      o += dia(CX, d4, R, "Uygun mu?");

      const hasY = 2090;
      o += pathArr([CX, d4 + R, CX, d4 + R + 18, L, d4 + R + 18, L, hasY], "d", NO);
      o += label(148, d4 + R + 14, "Hasarlı", NO);
      o += box(20, hasY, 220, BH, "Hasar raporu", "Depo süreci yeniden başlar", "exception");

      const d5 = 2260;
      o += vArr(CX, d4 + R, d5 - R, YES);
      o += label(412, d4 + R + 24, "Uygun", YES);
      o += dia(CX, d5, R, "Teslim GM mi?");

      const locY = 2370;
      o += pathArr([CX, d5 + R, CX, d5 + R + 18, L, d5 + R + 18, L, locY], "d", NO);
      o += label(148, d5 + R + 14, "Hayır", NO);
      o += box(20, locY, 220, BH, "İrsaliye 2: GM → Lokasyon", "Kartal / Ankara / İzmir", "system");

      const formY = 2520;
      o += pathArr([L, locY + BH, L, formY - 28, CX, formY - 28, CX, formY], "d", NO);
      o += vArr(CX, d5 + R, formY, YES);
      o += label(412, d5 + R + 24, "Evet · tek irsaliye", YES);
      o += box(BX, formY, BW, BH, "Zimmet formu oluştur", "Sistem Destek");
      const yImza = 2622;
      const yEnd = 2724;
      o += vArr(CX, formY + BH, yImza);
      o += box(BX, yImza, BW, BH, "Dijital imza / e-onay", "Çalışan · teslim alan");
      o += vArr(CX, yImza + BH, yEnd);
      o += box(BX, yEnd, BW, BH, "Zimmet tamamlandı", "Tamamlandı", "end");

      return chart(800, yEnd + BH + 24, o);
    }

    function ayrilisFlow() {
      const CX = 400, BX = 270, BW = 260, BH = 68, R = 70, L = 130;
      let o = "";
      const y1 = 16, y2 = 118, y3 = 220, y4 = 322, y5 = 424;
      o += box(BX, y1, BW, BH, "İK işten ayrılış kaydı", "İade Bekliyor", "start");
      o += vArr(CX, y1 + BH, y2);
      o += box(BX, y2, BW, BH, "Aktif zimmetleri getir", "Sistem", "system");
      o += vArr(CX, y2 + BH, y3);
      o += box(BX, y3, BW, BH, "Destek'e bildir", "Uygulama bildirimi", "system");
      o += vArr(CX, y3 + BH, y4);
      o += box(BX, y4, BW, BH, "Ürünleri teslim al", "Sistem Destek");
      o += vArr(CX, y4 + BH, y5);
      o += box(BX, y5, BW, BH, "Kontrol formu", "Model · seri · aksesuar · hasar");

      const d1 = 560;
      o += vArr(CX, y5 + BH, d1 - R);
      o += dia(CX, d1, R, "Lokasyon aynı mı?");
      const stopY = 670;
      o += pathArr([CX, d1 + R, CX, d1 + R + 18, L, d1 + R + 18, L, stopY], "d", NO);
      o += label(148, d1 + R + 14, "Hayır", NO);
      o += box(20, stopY, 220, BH, "Teslim durur", "Teslim ≠ çalışan lokasyonu", "exception");

      const y6 = 810;
      o += vArr(CX, d1 + R, y6, YES);
      o += label(412, d1 + R + 24, "Evet", YES);
      o += box(BX, y6, BW, BH, "Cihaz durumu seç", "Yeniden / bakım / hurda");
      const y7 = 912;
      o += vArr(CX, y6 + BH, y7);
      o += box(BX, y7, BW, BH, "İade Tamamla", "Sistem Destek");

      const d2 = 1050;
      o += vArr(CX, y7 + BH, d2 - R);
      o += dia(CX, d2, R, "GM dışı teslim?");
      const irs2Y = 1160;
      o += pathArr([CX, d2 + R, CX, d2 + R + 18, L, d2 + R + 18, L, irs2Y], "d", YES);
      o += label(148, d2 + R + 14, "Evet", YES);
      o += box(20, irs2Y, 220, BH, "İkinci sevk irsaliyesi", "Lokasyon → Genel Merkez", "system");

      const y8 = 1310;
      o += pathArr([L, irs2Y + BH, L, y8 - 28, CX, y8 - 28, CX, y8], "d", YES);
      o += vArr(CX, d2 + R, y8, NO);
      o += label(412, d2 + R + 24, "Hayır · tek irsaliye", NO);
      o += box(BX, y8, BW, BH, "Merkez depoya sevk", "Logo ERP irsaliye", "system");
      const y9 = 1412, y10 = 1514;
      o += vArr(CX, y8 + BH, y9);
      o += box(BX, y9, BW, BH, "Asset durumunu güncelle", "Sistem", "system");
      o += vArr(CX, y9 + BH, y10);
      o += box(BX, y10, BW, BH, "Süreç kapatıldı", "Tamamlandı", "end");
      return chart(800, y10 + BH + 24, o);
    }

    function devirFlow() {
      const CX = 400, BX = 270, BW = 260, BH = 68, R = 70, L = 130;
      let o = "";
      const y1 = 16, y2 = 118;
      o += box(BX, y1, BW, BH, "Zimmet kaydını seç", "Cihaz Zimmetleri", "start");
      o += vArr(CX, y1 + BH, y2);
      o += box(BX, y2, BW, BH, "Yeni kullanıcı seç", "Sistem Destek · LDAP");
      const d1 = 256;
      o += vArr(CX, y2 + BH, d1 - R);
      o += dia(CX, d1, R, "Aynı lokasyon mu?");
      const stopY = 366;
      o += pathArr([CX, d1 + R, CX, d1 + R + 18, L, d1 + R + 18, L, stopY], "d", NO);
      o += label(148, d1 + R + 14, "Hayır", NO);
      o += box(20, stopY, 220, BH, "Devir durur", "Lokasyon uyuşmazlığı", "exception");
      const yMgr = 510;
      o += vArr(CX, d1 + R, yMgr, YES);
      o += label(412, d1 + R + 24, "Evet", YES);
      o += box(BX, yMgr, BW, BH, "Departman yöneticisi onayı", "Varsayılan parametrik akış");
      const yCeo = 612;
      o += vArr(CX, yMgr + BH, yCeo);
      o += box(BX, yCeo, BW, BH, "CO / CEO onayı", "Onay yapısı değiştirilebilir");
      const d2 = 750;
      o += vArr(CX, yCeo + BH, d2 - R);
      o += dia(CX, d2, R, "Onaylandı mı?");
      const redY = 860;
      o += pathArr([CX, d2 + R, CX, d2 + R + 18, L, d2 + R + 18, L, redY], "d", NO);
      o += label(148, d2 + R + 14, "Hayır", NO);
      o += box(20, redY, 220, BH, "İşlem sonlanır", "İlgili kullanıcıya bildirim", "exception");
      const y3 = 1010;
      o += vArr(CX, d2 + R, y3, YES);
      o += label(412, d2 + R + 24, "Evet", YES);
      o += box(BX, y3, BW, BH, "Eski zimmeti kapat", "Sistem · sevk yok", "system");
      const steps = [
        [1112, "Yeni zimmet oluştur", "Geçmiş korunur", "system"],
        [1214, "Yeni zimmet formu", "Sistem Destek", ""],
        [1316, "İmza veya e-onay", "Yeni kullanıcı", ""],
        [1418, "Devir tamamlandı", "Fiziksel sevk yok", "end"],
      ];
      let prev = y3;
      steps.forEach((s) => {
        o += vArr(CX, prev + BH, s[0]);
        o += box(BX, s[0], BW, BH, s[1], s[2], s[3]);
        prev = s[0];
      });
      return chart(800, 1418 + BH + 24, o);
    }

    function degisimFlow() {
      const CX = 400, BX = 270, BW = 260, BH = 68, R = 70, L = 130;
      const RX = 660, RB = 540;
      let o = "";
      const y1 = 16, y2 = 118;
      o += box(BX, y1, BW, BH, "Değişim talebi oluştur", "Sistem Destek", "start");
      o += vArr(CX, y1 + BH, y2);
      o += box(BX, y2, BW, BH, "İlk teknik inceleme", "Sistem Destek Uzmanı");

      const d1 = 256;
      o += vArr(CX, y2 + BH, d1 - R);
      o += dia(CX, d1, R, "Çözülebilir mi?");
      const closeY = 366;
      o += pathArr([CX, d1 + R, CX, d1 + R + 18, RX, d1 + R + 18, RX, closeY], "d", YES);
      o += label(520, d1 + R + 14, "Evet", YES);
      o += box(RB, closeY, 220, BH, "Süreç kapanır", "Sorun yerinde çözüldü", "end");

      const yServ = 366;
      o += pathArr([CX, d1 + R, CX, d1 + R + 18, L, d1 + R + 18, L, yServ], "d", NO);
      o += label(148, d1 + R + 14, "Hayır", NO);
      o += box(20, yServ, 220, BH, "Teknik servise gönder", "Rapor zorunlu");
      const yRep = 468;
      o += vArr(L, yServ + BH, yRep);
      o += box(20, yRep, 220, BH, "Servis raporunu yükle", "Sisteme kaydedilir", "system");

      const d2x = L, d2y = 620, d2r = 68;
      o += vArr(L, yRep + BH, d2y - d2r);
      o += dia(d2x, d2y, d2r, "Değişim mi?");

      const yOnar1 = 760, yOnar2 = 862, yOnar3 = 964, yOnar4 = 1066;
      o += pathArr([d2x + d2r, d2y, RX, d2y, RX, yOnar1], "d", NO);
      o += label(250, d2y - 10, "Hayır · onarım", NO);
      o += box(RB, yOnar1, 220, BH, "Onarım onayı", "Onarıma tabi");
      o += vArr(RX, yOnar1 + BH, yOnar2);
      o += box(RB, yOnar2, 220, BH, "CO / CEO onayı", "Onarım kararı");
      o += vArr(RX, yOnar2 + BH, yOnar3);
      o += box(RB, yOnar3, 220, BH, "Onarım yapılır", "Teknik servis");
      o += vArr(RX, yOnar3 + BH, yOnar4);
      o += box(RB, yOnar4, 220, BH, "Kullanıma devam", "Yeni zimmet yok", "end");

      const yCh1 = 760, yCh2 = 862, yCh3 = 964;
      o += pathArr([d2x - d2r, d2y, 48, d2y, 48, yCh1], "d", YES);
      o += label(8, d2y - 10, "Evet", YES);
      o += box(8, yCh1, 200, BH, "Değişim kararı", "Emsal ürün de onaya tabi");
      o += vArr(48, yCh1 + BH, yCh2);
      o += box(8, yCh2, 200, BH, "Yönetici onayı", "Departman yöneticisi");
      o += vArr(48, yCh2 + BH, yCh3);
      o += box(8, yCh3, 200, BH, "CO / CEO onayı", "Değişim onayı");

      const yNew = 1220;
      o += pathArr([108, yCh3 + BH, 108, yNew - 28, CX, yNew - 28, CX, yNew], "d", YES);
      o += box(BX, yNew, BW, BH, "Yeni zimmet süreci", "İşe başlangıç ile aynı hat");
      const yOld = 1322, yEnd = 1424;
      o += vArr(CX, yNew + BH, yOld);
      o += box(BX, yOld, BW, BH, "Eski cihaz durumu", "Yeniden / bakım / hurda");
      o += vArr(CX, yOld + BH, yEnd);
      o += box(BX, yEnd, BW, BH, "Değişim tamamlandı", "Eski kapanır · yeni açılır", "end");
      return chart(800, yEnd + BH + 24, o);
    }

    function legend() {
      return `<div class="legend">
        <span><i class="swatch" style="background:#0f5f73;border-color:#0f5f73"></i> Başlangıç / bitiş</span>
        <span><i class="swatch" style="background:#eef1f5"></i> Manuel işlem</span>
        <span><i class="swatch" style="background:#e6f3f6"></i> Sistem / entegrasyon</span>
        <span><i class="swatch" style="background:#fbf3dc"></i> Karar</span>
        <span><i class="swatch" style="background:#fdecec;border-color:${NO}"></i> Red / istisna</span>
      </div>`;
    }
    function table(headers, rows) {
      return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }

    const pages = {
      ozet() {
        return `
          <div class="note"><b>V1.1 (31.08.2026).</b> Lokasyon teslimlerinde iki irsaliye (Depo→GM, GM→lokasyon). Cihaz değişimi teknik servis + onarım/değişim onayına bağlandı. Zimmet devri varsayılan olarak yönetici ve CO/CEO onayına tabi.</div>
          ${legend()}
          <div class="panel">
            <h2>Süreçler</h2>
            ${table(["Süreç", "Başlangıç", "Bitiş"], [
              ["İşe Başlangıç", "İK talep", "Zimmet + imza · Tamamlandı"],
              ["İşten Ayrılış", "İK iade kaydı", "Logo merkez sevk · gerekirse 2. irsaliye"],
              ["Zimmet Devri", "Destek kayıt seçer", "Yönetici + CO/CEO · yeni zimmet · sevk yok"],
              ["Cihaz Değişimi", "Destek talep + teknik inceleme", "Onarım veya yeni zimmet"],
            ])}
          </div>
          <div class="panel">
            <h2>V1.1’de değişen kurallar</h2>
            ${table(["Konu", "Kural"], [
              ["Genel Merkez teslim", "Tek irsaliye: Depo → Genel Merkez → teknik → zimmet"],
              ["Lokasyon teslim", "İki irsaliye: Depo → GM, ardından GM → hedef lokasyon"],
              ["İade teslim lokasyonu", "Çalışan lokasyonu ile farklı olamaz"],
              ["Zimmet devri onayı", "Varsayılan: Departman Yöneticisi → CO/CEO (parametrik)"],
              ["Cihaz değişimi", "Servis raporu zorunlu. Onarım veya değişim ayrı onaylanır"],
            ])}
          </div>`;
      },
      onb() {
        return `${legend()}
          <div class="note"><b>Stok kuralı.</b> Stokta mı? → Evet ise doğrudan Paket dahilinde mi? Hayır ise önce alternatif ürün seçilir, sonra yine paket kontrolüne gelinir.</div>
          <div class="note"><b>Lokasyon / irsaliye.</b> Teslim lokasyonu LDAP çalışma lokasyonundan gelir, değiştirilebilir. Her talep önce Depo → Genel Merkez gider ve teknik kontrol merkeze yapılır. Teslim GM değilse ikinci irsaliye (GM → lokasyon) oluşur, sonra zimmet.</div>
          <div class="panel">
            <h2>İşe başlangıç — uçtan uca</h2>
            <p>İK talep → lokasyon → Destek stok/paket → gerekirse CO/CEO → depo → irsaliye 1 → teknik → gerekirse irsaliye 2 → form → çalışan imzası.</p>
            ${onbFlow()}
          </div>`;
      },
      ayrilis() {
        return `${legend()}
          <div class="note"><b>Teslim lokasyonu.</b> İade teslim lokasyonu çalışan lokasyonu ile aynı olmak zorundadır. Genel merkez dışı teslimde ikinci sevk irsaliyesi oluşur.</div>
          <div class="panel">
            <h2>İşten ayrılış / zimmet iadesi</h2>
            ${ayrilisFlow()}
          </div>`;
      },
      devir() {
        return `${legend()}
          <div class="panel">
            <h2>Zimmet devri</h2>
            <p>Aynı lokasyon zorunlu. Fiziksel depo transferi yok. Varsayılan onay: Departman Yöneticisi → CO/CEO (sistem yöneticisi değiştirebilir).</p>
            ${devirFlow()}
          </div>`;
      },
      degisim() {
        return `${legend()}
          <div class="note"><b>V1.1.</b> Değişim doğrudan yeni cihaz seçimi değildir. Önce Destek incelemesi, çözülemezse teknik servis raporu. Onarım ve değişim ayrı onaylanır. Emsal ürün verilse bile onay yeniden çalışır. Rapor olmadan değişim yapılamaz.</div>
          <div class="panel">
            <h2>Cihaz değişimi</h2>
            <p>İnceleme → servis raporu → onarım (onay + CO/CEO) veya değişim (yönetici + CO/CEO + yeni zimmet).</p>
            ${degisimFlow()}
          </div>`;
      },
      eslesme() {
        return `<div class="panel">
          <h2>Doküman adımı → mockup ekranı</h2>
          ${table(["Doküman adımı", "Mockup", "Sonraki"], [
            ["İK personel + lokasyon", "Yeni işe başlangıç", "Destek kontrolü"],
            ["Paket + Logo stok", "İşe başlangıç detay", "Depo veya onay"],
            ["CO / CEO", "Onaylarım", "Depo veya Destek’e dönüş"],
            ["İrsaliye 1 Depo → GM", "Depo hazırlık", "Teknik kontrol"],
            ["İrsaliye 2 GM → lokasyon", "Depo / sevk", "Zimmet formu"],
            ["Form + imza", "Zimmet formu / Onaylarım", "Tamamlandı"],
            ["İade + teslim lokasyonu", "İşten ayrılış detay", "Logo sevk · gerekirse 2. irsaliye"],
            ["Devir + yönetici/CO onay", "Cihaz Zimmetleri → Devir", "Çalışan onay"],
            ["İlk inceleme / servis raporu", "Değişim talebi / detay", "Onarım veya yeni zimmet"],
          ])}
        </div>`;
      },
    };

    let current = new URLSearchParams(location.search).get("tab") || "onb";
    if (!pages[current]) current = "onb";
    function render() {
      document.getElementById("tabs").innerHTML = TABS.map((t) =>
        `<button class="${t.id === current ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`
      ).join("");
      document.querySelectorAll("#tabs button").forEach((btn) => {
        btn.onclick = () => {
          current = btn.dataset.tab;
          history.replaceState(null, "", "?tab=" + current);
          render();
        };
      });
      document.getElementById("app").innerHTML = pages[current]() +
        `<footer>Kaynak: Zimmet Gereksinim Dokümanı V1.1 · 31.08.2026</footer>`;
    }
    render();
  </script>
</body>
</html>

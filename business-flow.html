<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />

  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5c6570;
      --line: #d8dee6;
      --lane: #f3f5f8;
      --accent: #1a56db;
      --accent-text: #ffffff;
      --manual: #eef1f5;
      --auto-fill: #f7f8fa;
      --integ: #e4e9f7;
      --decision: #f4ead0;
      --exception: #f8e6e8;
      --process: #eef1f5;
      --system: #e4e9f7;
      --start: #1a56db;
      --yes: #1f8a65;
      --no: #c23b4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 20px 24px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    nav button.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 48px; }
    .note {
      background: #e8f0fe;
      border: 1px solid #c5d4f5;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .legend, .stats { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 16px; }
    .legend { font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #9aa3ad; display: inline-block; }
    .swatch.round { border-radius: 10px; background: var(--accent); border-color: var(--accent); width: 22px; height: 12px; }
    .swatch.diamond {
      width: 10px; height: 10px; transform: rotate(45deg);
      background: var(--decision); border-radius: 1px;
    }
    .swatch.ex { background: var(--exception); border-color: var(--no); }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 140px;
    }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
    .panel h3 { margin: 16px 0 8px; font-size: 14px; font-weight: 650; }
    .panel p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .flow-wrap { overflow-x: auto; display: flex; justify-content: center; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .map { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .map-box {
      border: 1px solid var(--line);
      background: #eef1f5;
      padding: 8px 12px;
      min-width: 110px;
      text-align: center;
      font-size: 13px;
    }
    .map-box small { display: block; color: var(--muted); font-size: 11px; }
    .arrow { color: var(--muted); }
    footer { color: var(--muted); font-size: 12px; padding-top: 8px; }
    svg text { font-family: Segoe UI, system-ui, sans-serif; }
  </style>
</head>

      },
    };

    function legend() {
      return `<div class="legend">
        <span><i class="swatch round"></i> Başlangıç / Bitiş</span>
        <span><i class="swatch" style="background:var(--process)"></i> Süreç adımı</span>
        <span><i class="swatch diamond"></i> Karar (Evet / Hayır)</span>
        <span><i class="swatch" style="background:var(--system)"></i> Sistem / entegrasyon</span>
        <span><i class="swatch ex"></i> Red / exception</span>
      </div>`;
    }

    function table(headers, rows) {
      return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }

    const pages = {
      ozet() {
        return `
          <div class="stats">
            <div class="stat"><b>6</b><span>Ana iş süreci</span></div>
            <div class="stat"><b>7</b><span>Aktör / lane</span></div>
            <div class="stat"><b>2</b><span>Harici entegrasyon</span></div>
            <div class="stat"><b>12</b><span>Asset durumu</span></div>
          </div>
          <div class="note"><b>Kapsam notu.</b> Doküman bir IT Asset, zimmet ve transfer sistemidir. Satın alma siparişi ile fatura eşleştirme süreci tanımlı değildir. “Satın alma ihtiyacı oluşturan talepler” yalnızca onay kapsamına alınabilecek işlem tiplerinden biridir.</div>
          <div class="panel">
            <h2>Süreç haritası</h2>
            <div class="map">
              ${[["İşe giriş","İK kaydı"],["Tahsis","Paket + stok"],["Hazırlama","Teknik kontrol"],["Zimmet","Form + imza"],["Kullanım","Assigned"]].map((s,i)=>`<div class="map-box"><b>${s[0]}</b><small>${s[1]}</small></div>${i<4?'<span class="arrow">→</span>':''}`).join("")}
            </div>
            <p>Kullanım aşamasından ayrılabilecek süreçler</p>
            <div class="map">
              ${[["Transfer / sevk","Depolar arası"],["Cihaz değişikliği","Eski iade + yeni zimmet"],["İşten ayrılış","İade kontrolü"],["Zimmet devri","Depo yok"]].map(s=>`<div class="map-box"><b>${s[0]}</b><small>${s[1]}</small></div>`).join("")}
            </div>
          </div>
          <div class="panel">
            <h2>Aktörler ve sorumluluk</h2>
            ${table(["Aktör","Rol","Tip"], [
              ["İnsan Kaynakları","İşe giriş kaydı onayı, işten ayrılış başlatma","Manuel"],
              ["IT kullanıcısı","Paket, stok seçimi, teknik kontrol, zimmet, transfer, iade","Manuel"],
              ["Çalışan","Dijital imza veya elektronik onay","Manuel"],
              ["Onaycı","Yönetici / direktör / CEO — parametrik kurala göre","Manuel"],
              ["Sistem","Paket önerisi, form, durum, SLA, bildirim, eskalasyon","Otomatik"],
              ["Logo ERP","Ürün, stok, depo, SN, transfer, sevk irsaliyesi","Entegrasyon"],
              ["LDAP / AD","Kimlik, yönetici, organizasyon, onaycı tespiti","Entegrasyon"],
            ])}
          </div>
          <div class="panel">
            <h2>Süreç sınırları</h2>
            ${table(["Süreç","Başlangıç","Bitiş","Kritik karar"], [
              ["İşe giriş / tahsis","İK çalışan kaydını onaylar","Asset Reserved","Paket güncelleme (opsiyonel)"],
              ["Hazırlama","Depodan çıkış","Ready For Assignment","Teknik kontrol başarılı mı?"],
              ["Zimmet","IT teslimi başlatır","Assigned + arşivlenen form","Onay gerekli mi? / Onaylandı mı?"],
              ["Transfer","Kaynak-hedef-asset seçilir","Hedefte In Stock","Onay ve sevk irsaliyesi"],
              ["İşten ayrılış","İK ayrılış başlatır","Reassignment / Maintenance / Retired","Cihaz durumu"],
              ["Zimmet devri","Uygun cihaz teslim alınır","Yeni zimmet, depo yok","Yeniden zimmete uygun mu?"],
              ["Cihaz değişikliği","Değişim talebi","Yeni Assigned, eski serbest","Onay gerekli mi?"],
            ])}
          </div>
        `;
      },
      ana() {
        return `
          ${legend()}
          <div class="panel">
            <h2>İşe giriş, tahsis, hazırlama ve zimmet</h2>
            <p>Başlangıç: İK çalışan kaydını onaylar. Bitiş: zimmet formu imzalanır ve asset Assigned olur. IT paketi gerekirse güncelleyebilir; stok Logo ERP’den anlık okunur.</p>
            ${renderSwim(FLOWS.ana, "ana")}
            <p>Statü: Reserved → Ready For Assignment → Assigned. Kontrol başarısızsa Maintenance. Onay reddinde süreç sonlanır.</p>
          </div>
        `;
      },
      transfer() {
        return `
          ${legend()}
          <div class="panel">
            <h2>Depolar arası transfer ve sevk irsaliyesi</h2>
            <p>Kullanıcı kaynak depo, hedef depo, asset, miktar ve seri no seçer. Onay sonrası Logo ERP’de transfer kaydı açılır. Sevk irsaliyesi opsiyoneldir; irsaliye numarası uygulamaya geri yazılır.</p>
            ${renderSwim(FLOWS.transfer, "transfer")}
          </div>
        `;
      },
      iade() {
        return `
          ${legend()}
          <div class="panel">
            <h2>İşten ayrılış ve iade</h2>
            <p>İK ayrılışı başlatır. Sistem aktif zimmetleri listeler. IT ürün, seri no, aksesuar, hasar ve çalışma testini yapar.</p>
            ${renderSwim(FLOWS.ayrilis, "ayrilis")}
          </div>
          <div class="panel">
            <h2>Zimmet devri</h2>
            <p>Uygun cihaz depoya dönmeden yeni kullanıcıya atanır. Sistem eski zimmeti kapatır, yenisini açar, formu üretir ve geçmişi korur.</p>
            ${renderSwim(FLOWS.devir, "devir")}
          </div>
          <div class="panel">
            <h2>Cihaz değişikliği</h2>
            <p>Yeni cihaz hazırlanır, mevcut cihaz teslim alınır. Eski asset Ready For Reassignment, yeni asset Assigned olur.</p>
            ${renderSwim(FLOWS.degisim, "degisim")}
          </div>
        `;
      },
      onay() {
        return `
          ${legend()}
          <div class="panel">
            <h2>Parametrik onay, SLA ve eskalasyon</h2>
            <p>Onay sabit kodlanmaz. Kural; kullanıcı, ürün, işlem tipi ve finansal kriterlere göre seçilir. Onay tamamlanmadan işleme devam edilmez. Ret işlemi sonlandırır. Varsayılan SLA 3 iş günüdür.</p>
            ${renderSwim(FLOWS.onay, "onay")}
            <h3>Örnek kural — monitör tutarı</h3>
            ${renderSwim(FLOWS.limit, "limit")}
          </div>
        `;
      },
      durum() {
        return `
          <div class="panel">
            <h2>Asset durum modeli</h2>
            ${table(["Durum","Anlam","Tipik geçiş"], [
              ["In Stock","Depoda","Transfer veya tahsis"],
              ["Reserved","Çalışan için ayrıldı","Tahsis sonrası"],
              ["In Transfer","Transfer sürecinde","In Stock → In Transfer → In Stock"],
              ["Ready For Assignment","Zimmete hazır","Kontrol sonrası"],
              ["Assigned","Kullanıcı zimmetinde","İmza sonrası"],
              ["Returned","İade alındı","Ayrılış / değişim"],
              ["Ready For Reassignment","Yeniden zimmetlenebilir","Uygun iade"],
              ["Maintenance","Bakımda","Kontrol başarısız"],
              ["Retired","Hurda","Kullanılamaz cihaz"],
              ["Lost","Kayıp","Süreç tanımlı değil"],
              ["Stolen","Çalıntı","Süreç tanımlı değil"],
            ])}
          </div>
          <div class="note"><b>Dokümanda tanımlı olmayanlar.</b> Lost ve Stolen için iş akışı yok. Fatura–sipariş eşleştirme bu sistemin kapsamı dışındadır.</div>
        `;
      },
    };

    let current = new URLSearchParams(location.search).get("tab") || "ana";
    if (!pages[current]) current = "ana";

    function render() {
      const nav = document.getElementById("tabs");
      nav.innerHTML = TABS.map((t) =>
        `<button class="${t.id === current ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`
      ).join("");
      nav.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          current = btn.dataset.tab;
          history.replaceState(null, "", "?tab=" + current);
          render();
        };
      });
      document.getElementById("app").innerHTML = pages[current]() +
        `<footer>Kaynak: Zimmet Gereksinim Dokümanı · IT Asset, Zimmet ve Transfer Yönetim Sistemi</footer>`;
    }
    render();
  </script>
</body>
</html>
